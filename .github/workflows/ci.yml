name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  GOLANGCI_LINT_VERSION: "v2.4.0"

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: golangci-lint
      uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}
        working-directory: backend
        args: --timeout=5m

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install system deps
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev nmap

    - name: Download Go deps
      run: go mod download
      working-directory: backend

    - name: Go vet
      run: go vet ./...
      working-directory: backend

    - name: Go build
      run: go build ./...
      working-directory: backend

    - name: Go test (race + coverage gate)
      working-directory: backend
      run: |
        go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
        total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
        echo "Total statement coverage: ${total}%"
        awk -v c="$total" 'BEGIN { if (c+0 < 50) { print "coverage below 50% floor"; exit 1 } }'

  backend-integration-test:
    name: Backend Integration Test
    runs-on: ubuntu-latest
    # Requires a real PostgreSQL. The tenant-scoping guarantees and migration
    # re-runnability are enforced by the database, so sqlmock cannot assert
    # them: without a live database, a schema that leaks data between tenants
    # is indistinguishable from one that does not.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seagles
          POSTGRES_PASSWORD: seagles_test_pw
          POSTGRES_DB: seagles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seagles -d seagles_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://seagles:seagles_test_pw@localhost:5432/seagles_test?sslmode=disable
      MIGRATIONS_DIR: backend/db/migrations
      JWT_SECRET: ""
      RATE_LIMIT_PER_MIN: "1000"
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install system deps
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev nmap

    - name: Download Go deps
      run: go mod download
      working-directory: backend

    - name: Go test (integration, real PostgreSQL)
      run: go test -tags=integration -count=1 -v ./tests/...
      working-directory: backend

  openapi-validate:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Validate OpenAPI spec
      run: npx @redocly/cli lint backend/api/swagger.json

  firmware-analyzer-test:
    name: Firmware Analyzer Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install system deps
      run: sudo apt-get update && sudo apt-get install -y binwalk

    - name: Install Python deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
      working-directory: firmware-analyzer

    - name: Pytest
      run: python -m pytest test_entropy.py test_binwalk_runner.py test_cve_lookup.py test_main.py -v
      working-directory: firmware-analyzer

  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install deps
      run: npm ci
      working-directory: frontend

    - name: Type check
      run: npx tsc --noEmit
      working-directory: frontend

    - name: ESLint
      run: npm run lint
      working-directory: frontend

    - name: Build
      run: npm run build
      working-directory: frontend

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install deps
      run: npm ci
      working-directory: frontend

    - name: Test
      run: npm test
      working-directory: frontend

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@f781cce5aab226378ee181d764ab90ea0be3cdd8 # v0.25.0
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH

    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
      with:
        sarif_file: trivy-results.sarif

  build-images:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-test
      - backend-integration-test
      - openapi-validate
      - firmware-analyzer-test
      - frontend-lint
      - frontend-test
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Lowercase image owner
      run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to GHCR
      if: github.event_name == 'push'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Backend image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: ./backend
        push: ${{ github.event_name == 'push' }}
        tags: ghcr.io/${{ env.IMAGE_OWNER }}/seagles-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Firmware analyzer image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: ./firmware-analyzer
        push: ${{ github.event_name == 'push' }}
        tags: ghcr.io/${{ env.IMAGE_OWNER }}/seagles-firmware-analyzer:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Frontend image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: ./frontend
        push: ${{ github.event_name == 'push' }}
        tags: ghcr.io/${{ env.IMAGE_OWNER }}/seagles-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

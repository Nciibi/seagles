run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
  - errcheck
  - gosimple
  - govet
  - ineffassign
  - staticcheck
  - unused
  - asciicheck
  - bodyclose
  - durationcheck
  - errorlint
  - exportloopref
  - goconst
  - gocritic
  - gofmt
  - goheader
  - goimports
  - gosec
  - misspell
  - nakedret
  - nilerr
  - noctx
  - prealloc
  - predeclared
  - revive
  - rowserrcheck
  - sqlclosecheck
  - tenv
  - thelper
  - tparallel
  - unconvert
  - unparam
  - whitespace

linters-settings:
  gosec:
    severity: medium
    confidence: medium

  govet:
    check-shadowing: true
    enable-all: true

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/Nciibi/seagles

issues:
  exclude-rules:
  - path: _test.go
    linters:
    - errcheck
    - gosec
    - noctx

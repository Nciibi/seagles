version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

issues:
  max-same-issues: 0

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - durationcheck
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - predeclared
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
    - unused
  settings:
    govet:
      enable-all: false
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/Nciibi/seagles

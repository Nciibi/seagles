server {
    # Unprivileged port. The Kubernetes manifest runs with
    # capabilities.drop: [ALL], which removes CAP_NET_BIND_SERVICE, so
    # listening on 80 fails with "bind() ... Permission denied" and the pod
    # CrashLoops. The Service and the compose port mapping publish this
    # externally (host 3000 in compose, Service port in Kubernetes), so
    # operators are unaffected.
    listen 8080;
    server_name localhost;
    client_max_body_size 256M;
    root /usr/share/nginx/html;
    index index.html;

    # Serve React app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Go backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

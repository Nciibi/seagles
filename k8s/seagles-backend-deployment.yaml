apiVersion: apps/v1
kind: Deployment
metadata:
  name: seagles-backend
  namespace: security-tools
  labels:
    app: seagles-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: seagles-backend
  template:
    metadata:
      labels:
        app: seagles-backend
    spec:
      serviceAccountName: seagles-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
      - name: seagles-backend
        image: your-registry.com/seagles-backend:v2.0.0
        ports:
        # The API serves both the REST surface and the Prometheus exposition
        # (/api/v1/metrics) from a single listener on PORT (8080). There is no
        # separate metrics listener, so no 9090 containerPort is declared.
        - containerPort: 8080
          name: http

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_RAW
            - NET_ADMIN

        env:
        # Network the scanner is authorised to probe. This must match the
        # SCAN_TARGET_CIDR in seagles-network-policy.yaml — if the policy does
        # not allow egress to this range, every probe fails and the platform
        # reports an empty network. Scan only networks you own or have written
        # permission to test.
        - name: NETWORK_CIDR
          value: "192.168.1.0/24"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: seagles-db-secrets
              key: connection-string
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: seagles-jwt-secret
              key: secret
        # Fail fast if the secret above is missing. Without a shared key each
        # replica generates its own RSA key pair, so tokens minted by one pod
        # are rejected by the others (intermittent 401s) and every rollout
        # invalidates all sessions.
        - name: REQUIRE_SHARED_JWT_KEY
          value: "true"
        - name: FIRMWARE_ANALYZER_TOKEN
          valueFrom:
            secretKeyRef:
              name: seagles-analyzer-secret
              key: token
        - name: FIRMWARE_ANALYZER_URL
          value: "http://seagles-firmware-analyzer.security-tools.svc.cluster.local:8001"
        - name: S3_ENDPOINT
          value: "minio-service.storage.svc.cluster.local:9000"
        - name: S3_BUCKET
          value: "seagles-firmware"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: seagles-s3-secrets
              key: access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: seagles-s3-secrets
              key: secret-key

        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 512Mi

        # Liveness: process-only endpoint. It performs no database query and no
        # dependency check, so a PostgreSQL/Redis/MinIO outage can never make
        # kubelet restart otherwise-healthy pods (which would turn a partial
        # outage into a total one).
        livenessProbe:
          httpGet:
            path: /api/v1/livez
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3

        # Readiness: gated on the database. Optional dependencies that are down
        # are reported as degraded in the body but do not fail the check.
        readinessProbe:
          httpGet:
            path: /api/v1/readyz
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        # Startup: /api/v1/livez succeeds as soon as the HTTP server is bound,
        # so this gates initialisation (migrations, RSA key load) without
        # waiting on dependencies.
        startupProbe:
          httpGet:
            path: /api/v1/livez
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30

        # main.go drains for up to 30s on SIGTERM. Kubernetes' default grace
        # period is also 30s, so the container would be SIGKILLed at the exact
        # moment the drain expires. Allow headroom above the drain timeout.
        terminationGracePeriodSeconds: 45

        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: data-volume
          mountPath: /app/data

      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: data-volume
        persistentVolumeClaim:
          claimName: seagles-data-pvc

apiVersion: v1
kind: ConfigMap
metadata:
  name: seagles-config
  namespace: security-tools
  labels:
    app.kubernetes.io/name: seagles
data:
  # Network the scanner is authorised to probe. Must match SCAN_TARGET_CIDR
  # in seagles-network-policy.yaml. Scan only networks you own.
  NETWORK_CIDR: "192.168.1.0/24"
  FIRMWARE_ANALYZER_URL: "http://seagles-firmware-analyzer.security-tools.svc.cluster.local:8001"
  S3_ENDPOINT: "minio-service.storage.svc.cluster.local:9000"
  S3_BUCKET: "seagles-firmware"
  VITE_API_URL: "/api/v1"
  SEAGLES_BACKEND: "http://seagles-backend.security-tools.svc.cluster.local:8080"
  LOG_LEVEL: "info"
  RATE_LIMIT_PER_MIN: "60"

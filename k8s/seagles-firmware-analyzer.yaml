apiVersion: apps/v1
kind: Deployment
metadata:
  name: seagles-firmware-analyzer
  namespace: security-tools
  labels:
    app: seagles-firmware-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seagles-firmware-analyzer
  template:
    metadata:
      labels:
        app: seagles-firmware-analyzer
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: seagles-firmware-analyzer
        image: your-registry.com/seagles-firmware-analyzer:v2.0.0
        ports:
        - containerPort: 8001
          name: http

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

        env:
        # Root the analyzer resolves stored firmware paths against. It must
        # point at the same directory the backend writes to: the backend
        # stages uploads in <claim>/firmware-uploads (see
        # backend/api/firmware.go) and stores "data/firmware-uploads/<name>"
        # in the firmware table, which main.py re-roots under FIRMWARE_ROOT.
        #
        # This replaces a `subPath: firmware-uploads` mount, which could not
        # start at all on a fresh claim: the kubelet requires a subPath
        # directory to already exist and will not create it, so the pod failed
        # with "MountVolume.SetUp failed: failed to prepare subPath" until the
        # backend happened to have written there first. Mounting the claim
        # whole and pointing FIRMWARE_ROOT at the subdirectory removes that
        # ordering dependency.
        - name: FIRMWARE_ROOT
          value: "/firmware/firmware-uploads"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: seagles-db-secrets
              key: connection-string
        - name: FIRMWARE_ANALYZER_TOKEN
          valueFrom:
            secretKeyRef:
              name: seagles-analyzer-secret
              key: token
        - name: NVD_API_KEY
          valueFrom:
            secretKeyRef:
              name: seagles-nvd-secret
              key: api-key
              optional: true

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6

        volumeMounts:
        # The whole claim, not a subPath: see the FIRMWARE_ROOT note above.
        - name: firmware-volume
          mountPath: /firmware
          readOnly: true

      volumes:
      - name: firmware-volume
        persistentVolumeClaim:
          # ReadWriteMany: see seagles-pvc.yaml.
          claimName: seagles-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: seagles-firmware-analyzer
  namespace: security-tools
  labels:
    app: seagles-firmware-analyzer
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: seagles-firmware-analyzer

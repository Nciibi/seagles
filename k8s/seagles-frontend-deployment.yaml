apiVersion: apps/v1
kind: Deployment
metadata:
  name: seagles-frontend
  namespace: security-tools
  labels:
    app: seagles-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: seagles-frontend
  template:
    metadata:
      labels:
        app: seagles-frontend
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
      - name: seagles-frontend
        image: your-registry.com/seagles-frontend:v2.0.0
        ports:
        # Unprivileged: capabilities.drop is [ALL], so no CAP_NET_BIND_SERVICE
        # and binding 80 would fail. Must stay in sync with the EXPOSE in
        # frontend/Dockerfile and the "listen" directive in
        # frontend/nginx.conf.template.
        - containerPort: 8080
          name: http

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        env:
        - name: VITE_API_URL
          value: "/api/v1"
        # Upstream for the nginx /api/ proxy. The Compose service name
        # ("backend") does not resolve in Kubernetes, so this must be the
        # Service DNS name. If it is unset, the literal ${SEAGLES_BACKEND}
        # survives templating and nginx exits with an unknown-variable error,
        # so the failure is a visible CrashLoop rather than a silent 502.
        - name: SEAGLES_BACKEND
          value: "http://seagles-backend.security-tools.svc.cluster.local:8080"

        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi

        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 10

        # readOnlyRootFilesystem is true, but nginx still needs to write:
        #   /var/run         - the master process pid file
        #   /var/log/nginx   - error and access logs
        #   /var/cache/nginx - client_body_temp and proxy_temp, which are
        #                       required because /api/ is proxied and
        #                       client_max_body_size is 256M: large firmware
        #                       uploads are buffered to disk, not memory.
        # Without these the worker fails to start with EACCES/ROFS.
        # fsGroup: 1000 makes the emptyDirs group-writable for the runAsUser.
        volumeMounts:
        - name: nginx-run
          mountPath: /var/run
        - name: nginx-log
          mountPath: /var/log/nginx
        - name: nginx-cache
          mountPath: /var/cache/nginx

      volumes:
      - name: nginx-run
        emptyDir: {}
      - name: nginx-log
        emptyDir: {}
      - name: nginx-cache
        emptyDir:
          # Bound the temp dir: it holds buffered upload bodies up to
          # client_max_body_size, so an unbounded emptyDir could consume all
          # of the node's ephemeral storage.
          sizeLimit: 1Gi

apiVersion: v1
kind: Namespace
metadata:
  name: security-tools
  labels:
    app.kubernetes.io/name: seagles
    app.kubernetes.io/part-of: seagles
    # Passive scanning needs NET_RAW, which even the Baseline profile forbids.
    # Report Restricted drift as warnings instead of enforcing and blocking the
    # scanner pods; enforce can be enabled once NET_RAW is no longer required.
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: seagles-quota
  namespace: security-tools
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 2Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: seagles-defaults
  namespace: security-tools
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 256Mi
    defaultRequest:
      cpu: 100m
      memory: 64Mi
    max:
      cpu: "2"
      memory: 1Gi

# TEMPLATE ONLY — these are placeholder values, not real credentials.
# Replace every CHANGE_ME value before applying to a real cluster, and prefer
# an external secret manager (Sealed Secrets / External Secrets / Vault) over
# committing this file with production values.
apiVersion: v1
kind: Secret
metadata:
  name: seagles-db-secrets
  namespace: security-tools
type: Opaque
stringData:
  connection-string: "postgresql://seagles:CHANGE_ME@postgres.storage.svc.cluster.local:5432/seagles?sslmode=require"
---
apiVersion: v1
kind: Secret
metadata:
  name: seagles-jwt-secret
  namespace: security-tools
type: Opaque
stringData:
  # A PKCS#1 or PKCS#8 RSA PRIVATE KEY PEM (openssl genrsa 2048).
  secret: "CHANGE_ME_PEM_RSA_PRIVATE_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: seagles-analyzer-secret
  namespace: security-tools
type: Opaque
stringData:
  # Must be at least 32 random characters; shared by backend and analyzer.
  token: "CHANGE_ME_ANALYZER_TOKEN_32_CHARS_MINIMUM"
---
apiVersion: v1
kind: Secret
metadata:
  name: seagles-s3-secrets
  namespace: security-tools
type: Opaque
stringData:
  access-key: "CHANGE_ME_S3_ACCESS_KEY"
  secret-key: "CHANGE_ME_S3_SECRET_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: seagles-nvd-secret
  namespace: security-tools
type: Opaque
stringData:
  api-key: "CHANGE_ME_NVD_API_KEY"

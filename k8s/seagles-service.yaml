apiVersion: v1
kind: Service
metadata:
  name: seagles-backend
  namespace: security-tools
  labels:
    app: seagles-backend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
  # /api/v1/metrics is served by the same 8080 listener; there is no separate
  # metrics port to route.
  selector:
    app: seagles-backend
---
apiVersion: v1
kind: Service
metadata:
  name: seagles-frontend
  namespace: security-tools
  labels:
    app: seagles-frontend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: seagles-frontend
